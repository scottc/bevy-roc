[package]
name = "host"
version = "0.1.0"
edition = "2024"
authors = ["scottc <scottc@users.noreply.github.com>"]

# jackdaw builds its editor artifacts in .jackdaw/ and edits this manifest
# only when you change the project's modules; `cargo run` works with or
# without the editor installed.

# Keeps this project out of any cargo workspace it was created inside.
# Delete to join the surrounding workspace instead.
[workspace]

[dependencies]
bevy = "0.20"
# Loads authored scenes (assets/*.bsn). `terrain` draws authored terrain and
# `pie` connects the editor's Play button; drop `pie` for a shipping build.
# The other features and crates come from the modules in jackdaw.toml.
jackdaw_runtime = { version = "0.20", features = ["terrain", "pie"] }
avian3d = "0.8"
jackdaw_avian_integration = { version = "0.20" }
